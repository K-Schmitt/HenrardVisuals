server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Serve .gz siblings produced at build time rather than compressing per
    # request. Falls back to on-the-fly gzip above when no sibling exists.
    gzip_static on;

    # Every location re-includes the security headers. nginx discards inherited
    # add_header directives in any block that declares one of its own, and each
    # block below sets Cache-Control — so a server-level declaration, which is
    # what this file used to have, reached exactly no responses.

    # ---- Static assets: content-hashed by Vite, safe to cache forever ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- HTML: never cache, so a deploy is picked up immediately ----
    # No `expires -1` here: try_files rewrites / to /index.html, which re-enters
    # location matching, and the directive's own Cache-Control would then be
    # emitted alongside the one below.
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---- Real 404s for paths that will never be a route ----
    # try_files below answers 200 for everything, so the SPA's own 404 view
    # renders inside a 200 response and crawlers index soft-404s. These paths
    # are pure probe traffic; answering them honestly costs nothing.
    location ~ ^/(api|wp-admin|wp-login|\.env|\.git) {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    # ---- SPA catch-all ----
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
