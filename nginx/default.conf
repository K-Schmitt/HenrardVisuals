server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Serve .gz siblings produced at build time rather than compressing per
    # request. Falls back to on-the-fly gzip above when no sibling exists.
    gzip_static on;

    # Every location re-includes the security headers. nginx discards inherited
    # add_header directives in any block that declares one of its own, and each
    # block below sets Cache-Control — so a server-level declaration, which is
    # what this file used to have, reached exactly no responses.

    # ---- Static assets: content-hashed by Vite, safe to cache forever ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- HTML: never cache, so a deploy is picked up immediately ----
    # No `expires -1` here: try_files rewrites / to /index.html, which re-enters
    # location matching, and the directive's own Cache-Control would then be
    # emitted alongside the one below.
    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ---- Probe traffic: refuse before the route chain runs ----
    # These paths will never be a route. The catch-all below would 404 them
    # anyway; refusing here keeps them out of the try_files stat calls.
    location ~ ^/(api|wp-admin|wp-login|\.env|\.git) {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    # ---- Routes ----
    # scripts/prerender.mjs emits one HTML file per route, each with its own
    # title, description and Open Graph block. $uri.html is what turns
    # /contact into contact.html without an external redirect, so the URL a
    # visitor sees stays the canonical one — a `$uri/` directory match would
    # have bounced /contact to /contact/ with a 301.
    #
    # The final =404 is the point of the change: the old `/index.html` fallback
    # answered 200 for every unknown path, so the SPA's 404 view rendered
    # inside a 200 and crawlers indexed soft-404s.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # The 404 document is the same bundle as every other route; React reads the
    # path on load and renders the NotFound view, so the body matches the
    # status instead of contradicting it.
    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
