# =========================================
# Kong API Gateway Configuration
# Supabase Self-Hosted Routes
# =========================================

_format_version: "2.1"
_transform: true

# ----------------------------------------
# Services
# ----------------------------------------
# CORS origins are listed explicitly on all three routes. They previously read
# origins: ["*"] together with credentials: true — a combination the Fetch spec
# forbids, and which Kong resolves by reflecting whatever Origin the request
# carried, i.e. credentialed cross-origin access from any site.
# http://localhost:5173 is listed for the dev stack; drop it from a
# production-only deployment if you prefer a tighter list.
services:
  # Auth Service (GoTrue)
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "https://henrardvisuals.com"
            - "https://www.henrardvisuals.com"
            - "http://localhost:5173"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-supabase-api-version
          exposed_headers:
            - Content-Length
            - Content-Range
            - X-Supabase-Api-Version
          credentials: true
          max_age: 3600
      # Nothing else in the stack meters the password grant: GoTrue v2.132.3
      # throttles mail sending, not /token, and nginx's limit_req_zone was in a
      # file no image ever loaded. Brute force against a known admin address
      # was unbounded.
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          limit_by: ip
          fault_tolerant: true
          hide_client_headers: false

  # REST API (PostgREST)
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "https://henrardvisuals.com"
            - "https://www.henrardvisuals.com"
            - "http://localhost:5173"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-supabase-api-version
            - Prefer
            - Range
            - accept-profile
            - content-profile
          exposed_headers:
            - Content-Length
            - Content-Range
          credentials: true
          max_age: 3600

  # Storage API
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "https://henrardvisuals.com"
            - "https://www.henrardvisuals.com"
            - "http://localhost:5173"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-supabase-api-version
            - upload-length
            - upload-offset
            - tus-resumable
            - upload-metadata
            - x-upsert
          exposed_headers:
            - Content-Length
            - Content-Range
            - upload-offset
          credentials: true
          max_age: 3600
