<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Critical CSS - Prevent flash of unstyled content -->
  <style>
    html,
    body,
    #root {
      background-color: #0A0A0A !important;
      margin: 0;
      padding: 0;
    }

    body {
      color: #F2F0EC;
      min-height: 100vh;
    }

    /* Initial loading state */
    #root:empty::after {
      content: '';
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0A;
    }
  </style>

  <!-- SEO Meta Tags -->
  <!-- No keywords meta: no major engine has used it since 2009. -->
  <title>Tristan Henrard — Model Portfolio | HenrardVisuals</title>
  <meta name="description"
    content="Portfolio of Tristan Henrard, editorial and fashion model based in France. Measurements, biography and selected work. Book via HenrardVisuals." />
  <meta name="author" content="HenrardVisuals" />
  <link rel="canonical" href="https://henrardvisuals.com/" />
  <link rel="alternate" hreflang="fr" href="https://henrardvisuals.com/" />
  <link rel="alternate" hreflang="en" href="https://henrardvisuals.com/?lang=en" />
  <link rel="alternate" hreflang="x-default" href="https://henrardvisuals.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Tristan Henrard — Model Portfolio" />
  <meta property="og:description"
    content="Portfolio of Tristan Henrard, editorial and fashion model based in France." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://henrardvisuals.com/" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:locale:alternate" content="en_GB" />
  <meta property="og:image" content="https://henrardvisuals.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tristan Henrard — Model Portfolio" />
  <meta name="twitter:description" content="Editorial and fashion model portfolio." />
  <meta name="twitter:image" content="https://henrardvisuals.com/og-image.jpg" />

  <!-- Supabase serves both the API and every image — connect early.
       Substituted from VITE_SUPABASE_URL at build time. -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
  <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

  <!-- Self-hosted; preload only what renders above the fold. The hero name is
       Bodoni and everything around it is Archivo, so both are on the critical
       path. The italic and Cyrillic faces are not — they load on demand. -->
  <link rel="preload" href="/fonts/bodoni-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Theme Color: matches the actual page background. -->
  <meta name="theme-color" content="#0A0A0A" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tristan Henrard",
      "jobTitle": "Model",
      "url": "https://henrardvisuals.com/",
      "image": "https://henrardvisuals.com/og-image.jpg",
      "sameAs": [
        "https://www.instagram.com/dyavol_litso",
        "https://www.linkedin.com/in/tristan-henrard-2688a6198/"
      ]
    }
  </script>
</head>

<body class="bg-ink text-bone antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
