# HenrardVisuals - Docker Compose Stack

services:
  # Frontend Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_SUPABASE_URL=https://api.henrardvisuals.com
        - VITE_SUPABASE_ANON_KEY=${ANON_KEY}
        # This stack runs imgproxy, so .env can safely set this to true.
        - VITE_IMAGE_TRANSFORM=${VITE_IMAGE_TRANSFORM:-false}
    container_name: henrard-app
    restart: unless-stopped
    environment:
      - VITE_SUPABASE_URL=https://api.henrardvisuals.com
      - VITE_SUPABASE_ANON_KEY=${ANON_KEY}
      - VITE_IMAGE_TRANSFORM=${VITE_IMAGE_TRANSFORM:-false}
    expose:
      - "80"
    networks:
      - henrard-network
      - proxy-public
    depends_on:
      kong:
        condition: service_healthy

  # Supabase - PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: henrard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: henrard_db
      # Consumed by migrations/006_authenticator_password.sh on first boot.
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - henrard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Supabase - Kong API Gateway
  kong:
    image: kong:2.8
    container_name: henrard-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,rate-limiting
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./volumes/kong/kong.yml:/var/lib/kong/kong.yml:ro
    expose:
      - "8000"
    networks:
      - henrard-network
      - proxy-public
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # Supabase - GoTrue Auth Service
  auth:
    image: supabase/gotrue:v2.132.3
    container_name: henrard-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://api.henrardvisuals.com
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/henrard_db?search_path=auth
      GOTRUE_SITE_URL: https://henrardvisuals.com
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # Defaults matter here: an unset variable expands to the empty string,
      # which GoTrue reads as false. Combined with autoconfirm, that made
      # POST /auth/v1/signup hand a usable authenticated JWT to anyone.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      # Autoconfirm true means an address is never verified. Requires the SMTP
      # settings below to be filled in.
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      # Server half of the reauthentication control the admin panel performs
      # client-side. Without these a stolen access token is full account
      # takeover in two requests: rewrite the email, then the password.
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@henrardvisuals.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-HenrardVisuals}
    networks:
      - henrard-network
    depends_on:
      db:
        condition: service_healthy

  # Supabase - PostgREST API
  rest:
    image: postgrest/postgrest:v11.2.2
    container_name: henrard-rest
    restart: unless-stopped
    environment:
      # authenticator, not postgres. PostgREST issues SET LOCAL ROLE from the
      # JWT's role claim; on a superuser connection that succeeds for any role,
      # including service_role (BYPASSRLS) and postgres itself, which bypasses
      # every policy in 005 regardless of FORCE ROW LEVEL SECURITY.
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/henrard_db
      # public only. The storage schema grants table privileges to anon, so
      # exposing it let an anonymous caller list every stored object — draft
      # filenames and upload times included. Nothing in src/ reads it over
      # REST; all storage access goes through /storage/v1/*.
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - henrard-network
    depends_on:
      db:
        condition: service_healthy

  # Supabase - Storage API
  storage:
    image: supabase/storage-api:v0.43.11
    container_name: henrard-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/henrard_db
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:8080
    volumes:
      - ./volumes/storage:/var/lib/storage
    networks:
      - henrard-network
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started

  # Supabase - Postgres Meta
  meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: henrard-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: henrard_db
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - henrard-network
    depends_on:
      db:
        condition: service_healthy

  # Image Proxy
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: henrard-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      # Deliberately "/", as upstream Supabase ships it: storage-api asks for
      # absolute paths (/var/lib/storage/...), so narrowing the root here makes
      # every transform resolve to /var/lib/storage/var/lib/storage/... and
      # 404. The container's only mount is the storage volume, read-only, so
      # this exposes nothing the service does not already serve.
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
    volumes:
      - ./volumes/storage:/var/lib/storage:ro
    networks:
      - henrard-network

networks:
  henrard-network:
    driver: bridge
  proxy-public:
    external: true
